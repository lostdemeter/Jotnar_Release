<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <defs>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.7" fill="#f2eadb"/>
    </pattern>
    <pattern id="inkdots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2.1" fill="#171411"/>
    </pattern>
  </defs>

  <!-- halftone field -->
  <circle cx="320" cy="318" r="252" fill="#171411"/>
  <circle cx="320" cy="318" r="252" fill="url(#dots)" opacity=".28"/>
  <circle cx="320" cy="318" r="276" fill="none" stroke="#171411" stroke-width="2" stroke-dasharray="2 9"/>

  <!-- crosshair -->
  <g stroke="#171411" stroke-width="2">
    <line x1="320" y1="28" x2="320" y2="86"/>
    <line x1="320" y1="552" x2="320" y2="610"/>
    <line x1="30" y1="318" x2="88" y2="318"/>
    <line x1="552" y1="318" x2="610" y2="318"/>
  </g>

  <!-- orbit nodes -->
  <g stroke="#171411" stroke-width="3">
    <line x1="320" y1="290" x2="144" y2="144"/>
    <line x1="320" y1="290" x2="512" y2="148"/>
    <line x1="320" y1="330" x2="500" y2="474"/>
    <line x1="320" y1="330" x2="132" y2="478"/>
  </g>
  <g stroke="#171411" stroke-width="4">
    <circle cx="144" cy="144" r="18" fill="#f2eadb"/>
    <circle cx="512" cy="148" r="18" fill="#e04437"/>
    <circle cx="500" cy="474" r="18" fill="#f2eadb"/>
    <circle cx="132" cy="478" r="18" fill="#f2eadb"/>
  </g>
  <g fill="#171411">
    <circle cx="144" cy="144" r="5"/>
    <circle cx="512" cy="148" r="5" fill="#f2eadb"/>
    <circle cx="500" cy="474" r="5"/>
    <circle cx="132" cy="478" r="5"/>
  </g>

  <!-- lower plate -->
  <g stroke="#171411" stroke-width="5" stroke-linejoin="round">
    <path d="M320 262 L536 372 L320 482 L104 372 Z" fill="#171411"/>
    <path d="M320 226 L536 336 L320 446 L104 336 Z" fill="#e04437"/>
    <path d="M320 190 L536 300 L320 410 L104 300 Z" fill="#f2eadb"/>
  </g>

  <!-- inner grid on top plate -->
  <g stroke="#171411" stroke-width="2" opacity=".55">
    <path d="M212 300 L320 242 L428 300 L320 358 Z" fill="none"/>
    <path d="M266 272 L374 330 M266 330 L374 272" fill="none"/>
  </g>

  <!-- central cube -->
  <g stroke="#171411" stroke-width="5" stroke-linejoin="round">
    <path d="M320 208 L404 254 L320 300 L236 254 Z" fill="#f2eadb"/>
    <path d="M236 254 L320 300 L320 394 L236 348 Z" fill="#171411"/>
    <path d="M404 254 L320 300 L320 394 L404 348 Z" fill="#e04437"/>
  </g>
  <!-- cube circuitry -->
  <g stroke="#f2eadb" stroke-width="2" opacity=".8">
    <path d="M250 276 L250 326 L292 350 M292 350 L292 318" fill="none"/>
    <path d="M372 276 L372 326 L330 350 M330 350 L330 318" fill="none"/>
    <circle cx="250" cy="276" r="4"/>
    <circle cx="372" cy="276" r="4"/>
  </g>
  <g stroke="#171411" stroke-width="2">
    <path d="M320 208 L320 300 M236 254 L404 254" opacity=".35"/>
  </g>

  <!-- floating stream glyphs -->
  <g fill="#171411">
    <rect x="96" y="236" width="46" height="10" transform="rotate(-18 96 236)"/>
    <rect x="96" y="256" width="70" height="10" transform="rotate(-18 96 256)"/>
    <rect x="96" y="276" width="30" height="10" transform="rotate(-18 96 276)"/>
    <rect x="500" y="392" width="46" height="10" transform="rotate(18 500 392)"/>
    <rect x="500" y="412" width="70" height="10" transform="rotate(18 500 412)"/>
    <rect x="500" y="432" width="30" height="10" transform="rotate(18 500 432)"/>
  </g>

  <!-- stamp marks -->
  <g stroke="#171411" stroke-width="3" fill="none">
    <path d="M436 92 l38 22 -38 22" />
    <path d="M204 92 l-38 22 38 22" />
  </g>

  <!-- halftone square accent -->
  <rect x="42" y="540" width="98" height="60" fill="url(#inkdots)" opacity=".7"/>
  <rect x="500" y="540" width="98" height="60" fill="url(#dots)" opacity=".9" stroke="#171411" stroke-width="2"/>
</svg>
