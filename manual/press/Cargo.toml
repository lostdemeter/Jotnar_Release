[package]
name = "jotnar-press"
version = "0.1.0"
edition = "2021"
description = "A small zine-style Markdown-to-PDF press for the Jotnar Field Manual"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
