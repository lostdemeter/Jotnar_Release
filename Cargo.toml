[package]
name = "jotnar"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Jotnar-LAN/DIG: geometric assembly language, runtime, and digital targets"

[[bin]]
name = "jotnar"
path = "src/bin/jotnar.rs"

[workspace]
members = ["crates/phi-core", "crates/jotnar-lab"]
exclude = ["manual/press"]

[dependencies]
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
regex = "1"
libm = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
phi-core = { path = "crates/phi-core" }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
