[package]
name = "jotnar-lab"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Trust-spine harness: certificates, gates, falsifiers, nulls, benches"

[lib]
name = "jotnar_lab"
path = "src/lib.rs"

[[bin]]
name = "jotnar-lab"
path = "src/bin/jotnar-lab.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
