[package]
name = "jotnar-gpu-runner"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Host-side HIP/CUDA runner for networked Jotnar jobs"

[lib]
name = "jotnar_gpu_runner"
path = "src/lib.rs"

[[bin]]
name = "jotnar-gpu-runner"
path = "src/main.rs"

[[bin]]
name = "jotnar-gpu-net"
path = "src/bin/jotnar-gpu-net.rs"

[dependencies]
jotnar = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
