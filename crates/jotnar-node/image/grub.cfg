set timeout=1
set default=0

# The kernel and initramfs live on the FAT EFI system partition. Disk
# access under UEFI goes through the firmware's block I/O, so no GRUB
# virtio/ahci driver is needed; only the partition and filesystem modules.
insmod part_gpt
insmod part_msdos
insmod fat
insmod search_fs_file


search --no-floppy --file --set=root /boot/vmlinuz
if [ ! -f /boot/vmlinuz ]; then
    set root=(hd0,gpt1)
fi

linux /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/init \
    loglevel=7 panic=10 net.ifnames=0
initrd /boot/initramfs.cpio.gz
boot
